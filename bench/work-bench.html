<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>tinyfly vs GSAP — per-frame work</title>
<style>
  body { margin: 0; background: #151515; color: #ddd; font: 13px/1.5 system-ui, sans-serif; }
  #stage { position: relative; height: 300px; overflow: hidden; border-bottom: 1px solid #333; }
  .box { position: absolute; width: 10px; height: 10px; background: #4a9eff; border-radius: 2px; will-change: transform, opacity; }
  #ui { padding: 12px 16px; }
  button { padding: 6px 12px; background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
  pre { background: #0f0f0f; padding: 12px; border-radius: 4px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui">
  <button id="run">Run</button> <span id="status">idle</span>
  <pre id="out">—</pre>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="module">
/**
 * Per-frame WORK benchmark — the discriminating one.
 *
 * The frame-interval benchmark is clamped by vsync: both libraries report a
 * 16.70ms median right up until they fall off a cliff, so it cannot tell you
 * how much headroom either has. This measures the actual main-thread time each
 * library spends per frame instead.
 *
 * Both are driven MANUALLY from the same loop so the comparison is symmetric:
 * GSAP's own ticker is put to sleep and its root advanced by hand via
 * `gsap.updateRoot`, which is GSAP's documented mechanism for this.
 */
import { Timeline, createTrack } from '/lib/engine/tinyfly-engine.js'
import { DOMAdapter } from '/src/adapters/dom/dom-adapter.ts'

const stage = document.getElementById('stage')
const out = document.getElementById('out')
const status = document.getElementById('status')

const FRAMES = 240
const COUNTS = [100, 500, 1000, 2000, 4000]

function makeBoxes(n) {
  stage.innerHTML = ''
  const boxes = []
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div')
    el.className = 'box'
    el.style.left = `${(i % 80) * 16}px`
    el.style.top = `${Math.floor(i / 80) * 12}px`
    stage.appendChild(el)
    boxes.push(el)
  }
  return boxes
}

function stats(samples) {
  const s = [...samples].sort((a, b) => a - b)
  const at = (p) => s[Math.min(s.length - 1, Math.floor(s.length * p))]
  return { median: at(0.5), p95: at(0.95), max: s[s.length - 1] }
}

/** Run `work(i)` once per animation frame, timing only the work itself. */
function timeFrames(frames, work) {
  return new Promise((resolve) => {
    const samples = []
    let i = 0
    function tick() {
      const t0 = performance.now()
      work(i)
      const t1 = performance.now()
      if (i > 20) samples.push(t1 - t0) // discard warm-up
      i++
      if (i < frames) requestAnimationFrame(tick)
      else resolve(stats(samples))
    }
    requestAnimationFrame(tick)
  })
}

async function tinyflyWork(n) {
  const boxes = makeBoxes(n)
  const adapter = new DOMAdapter()
  const tracks = []
  boxes.forEach((el, i) => {
    const name = `b${i}`
    adapter.registerTarget(name, el)
    tracks.push(
      createTrack({ id: `x${i}`, target: name, property: 'x',
        keyframes: [{ time: 0, value: 0 }, { time: 4000, value: 200, easing: 'ease-in-out' }] }),
      createTrack({ id: `o${i}`, target: name, property: 'opacity',
        keyframes: [{ time: 0, value: 1 }, { time: 4000, value: 0.2, easing: 'ease-in-out' }] }),
      createTrack({ id: `r${i}`, target: name, property: 'rotate',
        keyframes: [{ time: 0, value: 0 }, { time: 4000, value: 360, easing: 'linear' }] })
    )
  })
  const timeline = new Timeline({ id: 'w', tracks })
  timeline.onUpdate = (s) => adapter.applyState(s)
  timeline.play()

  const r = await timeFrames(FRAMES, () => timeline.tick(16.67))
  timeline.stop()
  return r
}

async function gsapWork(n) {
  const boxes = makeBoxes(n)
  gsap.killTweensOf(boxes)
  // Drive GSAP by hand so its work lands inside our timing window.
  gsap.ticker.sleep()

  const tl = gsap.timeline({ paused: true })
  tl.to(boxes, { x: 200, opacity: 0.2, rotation: 360, duration: 4, ease: 'power1.inOut' }, 0)
  tl.play()

  let t = 0
  const r = await timeFrames(FRAMES, () => { t += 0.01667; gsap.updateRoot(t) })

  tl.kill()
  gsap.killTweensOf(boxes)
  gsap.set(boxes, { clearProps: 'all' })
  gsap.ticker.wake()
  return r
}

const settle = () => new Promise((r) => setTimeout(r, 500))

document.getElementById('run').onclick = async () => {
  const rows = []
  rows.push('Main-thread work per frame, ms — both driven manually from the same loop')
  rows.push('(tick + apply for tinyfly; gsap.updateRoot for GSAP. 60fps budget = 16.67ms)')
  rows.push('')
  rows.push('elements  library    median      p95      max   headroom@60fps')
  rows.push('-'.repeat(64))

  for (const n of COUNTS) {
    const line = {}
    for (const [label, fn] of [['tinyfly', tinyflyWork], ['gsap', gsapWork]]) {
      status.textContent = `${label} @ ${n}…`
      await settle()
      const s = await fn(n)
      line[label] = s
      rows.push(
        String(n).padEnd(10) + label.padEnd(11) +
        s.median.toFixed(2).padStart(6) + s.p95.toFixed(2).padStart(9) +
        s.max.toFixed(1).padStart(9) +
        `${(16.67 / s.median).toFixed(1)}x`.padStart(16)
      )
    }
    const ratio = line.tinyfly.median / line.gsap.median
    rows.push(`${''.padEnd(21)}tinyfly/gsap = ${ratio.toFixed(2)}x`)
    rows.push('')
  }

  status.textContent = 'done'
  out.textContent = rows.join('\n')
  window.__work = rows.join('\n')
}
</script>
</body>
</html>
